name: Windows build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        platform: [x64]
    steps:
      - uses: actions/checkout@v4

      # The Visual Studio projects expect JUCE at C:\JUCE (see FxSound_App.vcxproj).
      # JUCE_PROJUCER_VERSION in fxsound/JuceLibraryCode/AppConfig.h is 0x90005.
      - name: Fetch JUCE 9.0.5
        shell: pwsh
        run: git clone --depth 1 --branch 9.0.5 https://github.com/juce-framework/JUCE.git C:\JUCE

      # The projects use the VS 2026 toolset (v145), which windows-latest provides.
      - uses: microsoft/setup-msbuild@v2

      - name: Build
        shell: pwsh
        run: >
          msbuild fxsound\Project\FxSound.sln
          /m /nologo /v:minimal
          /p:Configuration=Release
          /p:Platform=${{ matrix.platform }}

      - name: Collect binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Get-ChildItem -Recurse fxsound\Project -Filter *.exe | Where-Object { $_.FullName -match '\\Release\\' } | ForEach-Object { Write-Host $_.FullName; Copy-Item $_.FullName out\ }
          Copy-Item LICENSE out\
          if (-not (Get-ChildItem out -Filter *.exe)) { throw "No executable was produced" }

      - uses: actions/upload-artifact@v4
        with:
          name: BetterFxSound-${{ matrix.platform }}-${{ github.sha }}
          path: out\

  # fxmcp's unit tests (internal/...) are pure logic; cmd/fxmcp holds integration tests
  # that need a running FxSound, so they are not run here.
  fxmcp:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: fxmcp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: fxmcp/go.mod
          cache-dependency-path: fxmcp/go.sum

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test ./internal/...

      - name: Docs copy is current
        shell: pwsh
        run: |
          $a = (Get-Content ..\docs\COMMAND_LINE_OPTIONS.md -Raw) -replace "`r`n", "`n"
          $b = (Get-Content internal\mcpserver\docsdata\command_line_options.md -Raw) -replace "`r`n", "`n"
          if ($a -ne $b) { throw "run go generate ./... in fxmcp after editing docs/COMMAND_LINE_OPTIONS.md" }
